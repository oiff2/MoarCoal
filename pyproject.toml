[project]
name = "moarcoal"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.4",
    "jinja2>=3.1.6",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]

[project.scripts]
moarcoal = "moarcoal.__main__:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.pyright]
include = ["src", "tests", "tools"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
extraPaths = ["tools", "src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
exclude = ["*.md"]
