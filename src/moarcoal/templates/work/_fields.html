{# Felder einer Art; `kind.slug` wählt, `values` belegt vor. Das Steuerjahr ist das der Seite. #}
<input type="hidden" name="year" value="{{ values.get('year', '') }}">
{% if kind.slug == "erste-taetigkeitsstaette" %}
<label>Arbeitstage
  <input name="workdays" inputmode="numeric" value="{{ values.get('workdays', '') }}" required>
</label>
<label>Einfache Entfernung in km
  <input name="distance_km" inputmode="numeric" value="{{ values.get('distance_km', '') }}" required>
</label>
<label>Arbeitstage je Woche (optional)
  <input name="workdays_per_week" inputmode="numeric" value="{{ values.get('workdays_per_week', '') }}">
</label>
<label>Urlaubs- und Krankheitstage (optional)
  <input name="absence_days" inputmode="numeric" value="{{ values.get('absence_days', '') }}">
</label>
<label>Homeoffice-Tage (optional)
  <input name="homeoffice_days" inputmode="numeric" value="{{ values.get('homeoffice_days', '') }}">
</label>
<label>Davon mit eigenem Pkw gefahrene km, einfach (optional)
  <input name="car_distance_km" inputmode="numeric" value="{{ values.get('car_distance_km', '') }}">
</label>
<label>Beschreibung (optional)
  <input name="description" value="{{ values.get('description', '') }}">
</label>
{% else %}
<label>Betrag in EUR
  <input name="amount" inputmode="decimal" value="{{ values.get('amount', '') }}" required>
</label>
<label>Datum
  <input name="date" type="date" value="{{ values.get('date', '') }}" required>
</label>
<label>Beschreibung
  <input name="description" value="{{ values.get('description', '') }}" required>
</label>
<label>Nutzungsdauer in Jahren ({{ form.useful_life_hint }})
  <input name="useful_life_years" inputmode="numeric" value="{{ values.get('useful_life_years', '') }}">
</label>
{% endif %}
