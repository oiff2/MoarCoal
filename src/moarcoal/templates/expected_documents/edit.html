{% extends "base.html" %}
{% block title %}Erwarteten Beleg ändern – MoarCoal{% endblock %}
{% block main %}
<h1>Erwarteten Beleg ändern</h1>
<p><a href="/erwartete-belege">Zurück zu Erwartete Belege</a></p>
{% include "work/_errors.html" %}
<form method="post" action="/erwartete-belege/{{ entry_id }}">
  <input type="hidden" name="checksum" value="{{ checksum }}">
  {% include "expected_documents/_fields.html" %}
  <button type="submit">Speichern</button>
</form>
<form method="post" action="/erwartete-belege/{{ entry_id }}/loeschen" class="inline">
  <input type="hidden" name="checksum" value="{{ checksum }}">
  <button type="submit">Löschen</button>
</form>
{% endblock %}
