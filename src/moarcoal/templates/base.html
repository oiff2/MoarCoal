<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <title>{% block title %}MoarCoal{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <header>
    <nav>
      <a href="/">MoarCoal</a>
      {% for module in modules %}
      <a href="{{ module.nav_url }}">{{ module.nav_label }}</a>
      {% endfor %}
      <span>{{ user_name }}</span>
    </nav>
  </header>
  <main>
    {% block main %}{% endblock %}
  </main>
</body>
</html>
