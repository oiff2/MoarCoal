<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <title>{% block title %}MoarCoal{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/aussteller.js" defer></script>
</head>
<body>
  <header>
    <nav>
      <a href="/">MoarCoal</a>
      {% if user_name %}
      {% for module in modules %}
      <a href="{{ module.nav_url }}">{{ module.nav_label }}</a>
      {% endfor %}
      <a href="/belege">Belege{% if open_files %} ({{ open_files }}){% endif %}</a>
      <a href="/aussteller">Aussteller</a>
      <a href="/befunde">Befunde</a>
      <a href="/person">{{ user_name }}</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block main %}{% endblock %}
  </main>
</body>
</html>
